name: Rubric Grader & Challenge Evaluator

on:
  pull_request:
    paths:
      - 'submissions/**'
      - 'challenges/**'
  push:
    branches:
      - main
    paths:
      - 'submissions/**'
      - 'challenges/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Reference Solution (Baseline 100/100)
        run: |
          python3 scripts/evaluate_submission.py challenges/CHALLENGE-01-FLASHSALE-LOCKING/solution-reference/

      - name: Grade Submissions
        run: |
          if [ -d "submissions" ]; then
            for sub_dir in submissions/*/; do
              if [ -d "$sub_dir" ] && [ "$(basename "$sub_dir")" != "TEMPLATE" ]; then
                echo "Evaluating $sub_dir..."
                python3 scripts/evaluate_submission.py "$sub_dir"
              fi
            done
          fi

      - name: Update Hall of Fame (Main Branch Only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/generate_hall_of_fame.py
          git config --local user.email "action@github.com"
          git config --local user.name "SysBlueprint CI Bot"
          git add data/hall_of_fame.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ci): update hall_of_fame.json [skip ci]" && git push)
